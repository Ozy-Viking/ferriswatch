name: Publish Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "!docs/Onedev.md"
      - ".github/workflows/wiki.yml"

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: docs/
          ignore: |
            Onedev.md
