[package]
name = "ferriswatch-core"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
publish.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
dioxus = { workspace = true, optional = true }
dioxus-sdk-storage = { workspace = true, optional = true }
miette.workspace = true
serde.workspace = true
syntect = { workspace = true, optional = true }
thiserror.workspace = true
web-sys = { workspace = true, optional = true }

[features]
dioxus = ["dep:dioxus", "dep:web-sys", "dep:dioxus-sdk-storage"]
syntect = ["dep:syntect"]
parser = []

[package.metadata.cargo-machete]
# Enables Location for Dioxus browser builds; no ferriswatch-core source imports it.
ignored = ["web-sys"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
