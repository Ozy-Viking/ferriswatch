[package]
name = "ferriswatch-vendor-dioxus-primitives"
version.workspace = true
edition = "2021"
rust-version = "1.80.0"
description = "Vendored dioxus-primitives for Ferriswatch"
readme = "README.md"
keywords = ["gui", "dioxus", "components", "primitives"]
categories = ["gui", "wasm"]
authors = ["Dioxus Labs", "DogeDark"]
license = "MIT OR Apache-2.0"
homepage = "https://dioxuslabs.com"
repository = "https://github.com/Ozy-Viking/ferriswatch/"
publish.workspace = true

[lib]
name = "dioxus_primitives"

[dependencies]
dioxus.workspace = true
dioxus-attributes.workspace = true
dioxus-sdk-time.workspace = true
num-integer.workspace = true
palette.workspace = true
serde = { workspace = true, features = ["derive"] }
time.workspace = true
tracing.workspace = true

[build-dependencies]
lazy-js-bundle.workspace = true

[dev-dependencies]
dioxus-ssr.workspace = true

[features]
default = ["router"]
router = ["dioxus/router"]
web = ["time/wasm-bindgen"]
