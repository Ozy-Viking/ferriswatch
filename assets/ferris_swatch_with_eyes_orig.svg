<path fill="url(#fw-shadow)" d="M 78 687 Q 87 637 144 625 L 228 647 Q 252 672 293 689 Q 346 721 367 766 Q 380 807 324 824 Q 267 842 214 831 Q 208 838 220 860 L 252 905 C 149 904 70 817 78 687 Z"/>
<path fill="url(#fw-claw)" d="M 76 684 C 83 607 140 548 205 542 Q 255 540 285 579 Q 302 603 297 632 Q 294 653 281 645 L 231 601 Q 215 588 212 611 Q 208 633 218 650 C 275 663 337 703 361 755 Q 376 784 350 795 C 296 818 221 806 161 783 Q 106 761 84 723 Q 74 708 76 684 Z"/>
</svg>
