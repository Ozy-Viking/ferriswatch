<path fill="url(#fw-paper)" d="M 283 670 L 442 613 Q 489 598 503 642 L 605 1021 Q 621 1072 580 1093 L 500 1121 Q 448 1139 422 1096 L 256 838 L 252 704 Z"/>
<path fill="url(#fw-primary)" d="M 303 696 L 449 643 Q 473 635 483 661 L 550 918 L 379 993 L 292 847 Z"/>
<circle cx="542" cy="1034" r="30" fill="#dce0e5"/>
<circle cx="542" cy="1035" r="28" fill="#2d303a"/>
