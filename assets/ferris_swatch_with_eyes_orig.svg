<ellipse cx="487" cy="500" rx="62" ry="80" fill="url(#fw-eye)" transform="rotate(3 487 500)"/>
<ellipse cx="770" cy="498" rx="62" ry="81" fill="url(#fw-eye)" transform="rotate(-3 770 498)"/>
<ellipse cx="473" cy="468" rx="23" ry="31" fill="#ffffff" transform="rotate(18 473 468)"/>
<ellipse cx="753" cy="465" rx="22" ry="31" fill="#ffffff" transform="rotate(5 753 465)"/>
<path fill="#0b0c0f" d="M 577 541 Q 583 532 592 541 Q 627 566 664 542 Q 677 532 682 544 C 683 567 655 587 629 586 C 604 586 579 570 575 550 Q 573 545 577 541 Z"/>
