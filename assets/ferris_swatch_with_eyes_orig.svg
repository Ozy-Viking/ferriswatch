<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254">
<title>Ferris holding theme colour swatches</title>
<defs>
  <radialGradient id="fw-body" cx="48%" cy="36%" r="73%">
    <stop stop-color="#ff7838"/><stop offset=".58" stop-color="#ff6328"/><stop offset="1" stop-color="#f45120"/>
  </radialGradient>
  <linearGradient id="fw-shadow" x2=".75" y2="1">
    <stop stop-color="#d84a22"/><stop offset="1" stop-color="#a92e15"/>
  </linearGradient>
  <radialGradient id="fw-claw" cx="35%" cy="23%" r="78%">
    <stop stop-color="#ff9145"/><stop offset=".35" stop-color="#ff702e"/><stop offset="1" stop-color="#ff5e24"/>
  </radialGradient>
  <radialGradient id="fw-eye" cx="34%" cy="82%" r="75%">
    <stop stop-color="#30313b"/><stop offset=".4" stop-color="#111216"/><stop offset="1" stop-color="#090a0d"/>
  </radialGradient>
  <linearGradient id="fw-paper" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#ffffff"/><stop offset=".75" stop-color="#fafafb"/><stop offset="1" stop-color="#e9ebee"/>
  </linearGradient>
  <linearGradient id="fw-primary" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="var(--fw-primary, #fc6b3c)"/>
    <stop offset="1" stop-color="var(--fw-primary, #fc6b3c)"/>
  </linearGradient>
  <linearGradient id="fw-warning" x1="0" y1="0" x2="1" y2=".3">
    <stop stop-color="var(--fw-warning-shade, #efa916)"/>
    <stop offset=".35" stop-color="var(--fw-warning, #fcbc2f)"/>
    <stop offset="1" stop-color="var(--fw-warning, #fcbc2f)"/>
  </linearGradient>
  <linearGradient id="fw-success" x1="0" y1=".6" x2="1" y2=".3">
    <stop stop-color="var(--fw-success-shade, #108d88)"/>
    <stop offset=".5" stop-color="var(--fw-success, #1cb0a6)"/>
    <stop offset="1" stop-color="var(--fw-success, #1cb0a6)"/>
  </linearGradient>
  <linearGradient id="fw-info" x1="0" y1=".8" x2="1" y2=".2">
    <stop stop-color="var(--fw-info-shade, #2364cf)"/>
    <stop offset=".65" stop-color="var(--fw-info, #458bed)"/>
    <stop offset="1" stop-color="var(--fw-info, #458bed)"/>
  </linearGradient>
<!-- Match the front card's white footer depth relative to each card's base. -->
<clipPath id="fw-warning-colour-area"><path transform="translate(48 26) rotate(22 542 1034)" d="M -1000 -1000 L 2000 -1000 L 2000 282.035 L -1000 1597.825 Z"/></clipPath>
<clipPath id="fw-success-colour-area"><path transform="translate(133 44) rotate(44 542 1034)" d="M -1000 -1000 L 2000 -1000 L 2000 282.035 L -1000 1597.825 Z"/></clipPath>
<clipPath id="fw-info-colour-area"><path transform="translate(179 46) rotate(66 542 1034)" d="M -1000 -1000 L 2000 -1000 L 2000 282.035 L -1000 1597.825 Z"/></clipPath>
</defs>
<!-- A continuous silhouette avoids transparent seams between traced fragments. -->
<path fill="url(#fw-body)" d="M 199 543 C 172 500 160 466 196 452 Q 217 445 245 441 Q 255 440 250 423 C 237 386 222 356 256 347 Q 281 339 316 348 Q 329 352 327 335 C 325 293 326 256 354 258 Q 379 259 417 275 Q 433 280 437 261 C 448 217 460 190 485 195 Q 514 200 548 232 Q 558 241 568 225 C 593 187 609 161 632 169 Q 652 176 679 225 Q 689 243 701 232 C 737 201 767 180 787 202 Q 807 224 814 261 Q 817 282 833 276 C 873 260 900 248 916 266 Q 930 283 927 333 Q 926 350 941 348 C 978 342 1003 341 1014 365 Q 1022 384 1006 425 Q 999 442 1015 445 C 1053 450 1076 459 1077 480 Q 1076 500 1051 541 C 1135 554 1179 618 1179 704 Q 1177 798 1092 863 L 977 907 L 262 905 C 163 913 75 830 75 715 C 72 625 112 562 199 543 Z"/>
