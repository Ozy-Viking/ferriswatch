<path fill="url(#fw-paper)" d="M 934 718 C 984 739 1066 809 1105 852 Q 1128 882 1098 902 L 755 1111 Q 715 1137 679 1119 L 619 1086 Z"/>
<path clip-path="url(#fw-info-colour-area)" fill="url(#fw-info)" d="M 945 744 Q 953 741 965 750 C 1007 779 1054 823 1075 852 Q 1090 875 1069 889 L 745 1090 Q 712 1109 684 1098 L 663 1086 Z"/>
<!-- Teal card. -->
<path fill="url(#fw-paper)" d="M 730 627 Q 744 621 763 628 L 921 687 Q 955 700 943 735 L 742 1087 Q 720 1124 681 1120 L 586 1104 Z"/>
<path clip-path="url(#fw-success-colour-area)" fill="url(#fw-success)" d="M 732 663 Q 743 652 760 659 L 891 707 Q 916 716 907 739 L 714 1069 Q 696 1102 663 1094 L 622 1086 Z"/>
<!-- Yellow card. -->
<path fill="url(#fw-paper)" d="M 491 620 Q 580 607 681 608 Q 734 606 734 652 Q 734 666 729 684 L 628 1077 Q 618 1121 576 1115 L 510 1100 Z"/>
<path clip-path="url(#fw-warning-colour-area)" fill="url(#fw-warning)" d="M 509 646 Q 587 635 674 635 Q 707 634 700 665 L 605 1013 Z"/>
