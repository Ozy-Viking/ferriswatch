<svg class="ferris-swatch" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Ferris Swatch</title>
  <desc id="desc">A cheerful Ferris crab holding a fan of colour swatches.</desc>

  <style>
    .ferris-swatch {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --shadow: #00000022;
      --ferris: #ff5a2a;
      --ferris-dark: #c83818;
      --ink: #17202a;
      --paper: #f5f7fa;

      /* Theme-controlled swatches */
      --swatch-1: #ff6b45;
      --swatch-2: #f7b733;
      --swatch-3: #24a98a;
      --swatch-4: #3478c7;
    }

    .bg { fill: var(--bg); }
    .shadow { fill: var(--shadow); }
    .body { fill: var(--ferris); }
    .body-dark { fill: var(--ferris-dark); }
    .ink { fill: var(--ink); }
    .paper { fill: var(--paper); }
    .s1 { fill: var(--swatch-1); }
    .s2 { fill: var(--swatch-2); }
    .s3 { fill: var(--swatch-3); }
    .s4 { fill: var(--swatch-4); }
  </style>

  <!-- App icon background -->
  <rect class="bg" x="16" y="16" width="480" height="480" rx="108"/>

  <!-- Soft grounding shadow -->
  <ellipse class="shadow" cx="256" cy="430" rx="142" ry="28"/>

  <!-- Ferris body -->
  <path class="body" d="
    M143 275
    C143 193 191 132 256 132
    C321 132 369 193 369 275
    C369 358 323 410 256 410
    C189 410 143 358 143 275Z"/>

  <!-- Head ridges -->
  <path class="body" d="
    M168 163
    L181 132 L196 151 L209 120 L224 147
    L241 113 L257 145 L276 115 L291 148
    L310 124 L322 153 L344 137 L348 175
    Z"/>

  <!-- Left claw -->
  <path class="body" d="M153 210 C101 176 71 202 80 237 C88 268 121 268 155 245 Z"/>
  <path class="body-dark" d="M103 213 C74 194 56 211 64 232 C73 253 96 249 118 235 Z"/>
  <path class="bg" d="M87 210 C102 205 113 209 122 218 C109 222 100 230 95 240 C85 231 82 220 87 210Z"/>

  <!-- Right claw -->
  <path class="body" d="M359 210 C411 176 441 202 432 237 C424 268 391 268 357 245 Z"/>
  <path class="body-dark" d="M409 213 C438 194 456 211 448 232 C439 253 416 249 394 235 Z"/>
  <path class="bg" d="M425 210 C410 205 399 209 390 218 C403 222 412 230 417 240 C427 231 430 220 425 210Z"/>

  <!-- Arms around swatches -->
  <path class="body" d="M153 275 C111 260 87 278 91 306 C95 330 119 337 159 316 Z"/>
  <path class="body" d="M359 275 C401 260 425 278 421 306 C417 330 393 337 353 316 Z"/>

  <!-- Eyes -->
  <ellipse class="ink" cx="211" cy="202" rx="18" ry="24"/>
  <ellipse class="ink" cx="301" cy="202" rx="18" ry="24"/>
  <ellipse cx="205" cy="194" rx="6" ry="9" fill="#fff"/>
  <ellipse cx="295" cy="194" rx="6" ry="9" fill="#fff"/>

  <!-- Smile -->
  <path d="M238 232 C246 244 266 244 274 232"
        fill="none" stroke="var(--ink)" stroke-width="10" stroke-linecap="round"/>

  <!-- Swatch fan -->
  <g transform="translate(256 323)">
    <!-- Back cards -->
    <g transform="rotate(-38)">
      <rect class="paper" x="-103" y="-76" width="62" height="168" rx="13"/>
      <rect class="s1" x="-95" y="-68" width="46" height="112" rx="7"/>
      <circle class="ink" cx="-72" cy="69" r="8"/>
    </g>

    <g transform="rotate(-17)">
      <rect class="paper" x="-76" y="-85" width="62" height="176" rx="13"/>
      <rect class="s2" x="-68" y="-77" width="46" height="121" rx="7"/>
      <circle class="ink" cx="-45" cy="69" r="8"/>
    </g>

    <g transform="rotate(7)">
      <rect class="paper" x="-36" y="-88" width="62" height="179" rx="13"/>
      <rect class="s3" x="-28" y="-80" width="46" height="124" rx="7"/>
      <circle class="ink" cx="-5" cy="69" r="8"/>
    </g>

    <g transform="rotate(31)">
      <rect class="paper" x="6" y="-81" width="62" height="171" rx="13"/>
      <rect class="s4" x="14" y="-73" width="46" height="117" rx="7"/>
      <circle class="ink" cx="37" cy="68" r="8"/>
    </g>

    <!-- Fan pivot -->
    <circle class="paper" cx="0" cy="71" r="18"/>
    <circle class="ink" cx="0" cy="71" r="7"/>
  </g>

  <!-- Little lower legs -->
  <path class="body" d="M174 369 C139 378 124 400 133 421 C141 438 166 430 192 397 Z"/>
  <path class="body" d="M338 369 C373 378 388 400 379 421 C371 438 346 430 320 397 Z"/>
</svg>
