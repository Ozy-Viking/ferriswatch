<title>Ferriswatch · Palette inspector</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0eee8;color:#282a2d;font-family:"DejaVu Sans",sans-serif;font-size:14px;line-height:1.5}.masthead{padding:36px 4vw 28px;border-bottom:1px solid #c7c4bb;display:flex;align-items:end;justify-content:space-between;gap:24px}.masthead h1{font:500 42px/1.05 Georgia,serif;letter-spacing:-1px;margin:8px 0}.masthead p{margin:12px 0 0;max-width:590px}.eyebrow{font:11px/1.5 "DejaVu Sans Mono",monospace;text-transform:uppercase;letter-spacing:1.1px}#search{width:260px;background:transparent;border:0;border-bottom:2px solid #282a2d;padding:12px 0;font:inherit}#count{display:block;font:12px monospace;margin-top:10px}.catalogue{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,600px),1fr));gap:24px;padding:28px 4vw}.theme{color:var(--text);background:var(--background);border:1px solid var(--border);border-radius:8px;overflow:hidden}.theme header{padding:22px;display:flex;justify-content:space-between;gap:12px;align-items:start;border-bottom:1px solid var(--border-muted)}.theme h2{font:500 27px/1.2 Georgia,serif;margin:5px 0 8px}.theme code{font-size:11px;color:var(--muted)}label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted)}select{max-width:175px;padding:8px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:4px}select:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:3px}.groups{display:grid;grid-template-columns:1fr 1fr}.groups section{padding:18px;background:var(--group-background)}.normal{--group-background:var(--background);--group-surface:var(--surface);--group-raised:var(--raised);--group-overlay:var(--overlay);--group-hover:var(--hover)}.alternate{--group-background:var(--alt-background);--group-surface:var(--alt-surface);--group-raised:var(--alt-raised);--group-overlay:var(--alt-overlay);--group-hover:var(--alt-hover)}h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:500;margin:0 0 14px}.panel{padding:14px;background:var(--group-surface);border:1px solid var(--border-muted);border-radius:4px}.panel p{font-size:12px;margin:9px 0}.muted{color:var(--muted)}.subtle{color:var(--subtle)}.raised{background:var(--group-raised);padding:12px;margin-top:16px;border-radius:3px}.raised span{display:block;font-size:11px}.surface-hover{margin:8px 0;padding:8px 12px;background:var(--group-hover);font-size:12px}.popup{margin-top:12px;background:var(--group-overlay);padding:12px;border:1px solid var(--border);border-radius:4px;box-shadow:0 5px 12px #0002}.popup strong{font-size:12px}.actions{padding:18px 22px;display:grid;gap:16px;border-top:1px solid var(--border-muted)}.states{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}button{border:0;border-radius:4px;padding:9px 12px;font:600 11px "DejaVu Sans",sans-serif;cursor:pointer}.primary{color:var(--on-primary);background:var(--primary)}.primary.hover,.primary:hover{background:var(--primary-hover)}.primary.pressed,.primary:active{background:var(--primary-pressed)}.secondary{color:var(--on-secondary);background:var(--secondary)}.secondary.hover,.secondary:hover{background:var(--secondary-hover)}.secondary.pressed,.secondary:active{background:var(--secondary-pressed)}.focus{outline:2px solid var(--focus);outline-offset:2px}.primary.disabled{background:var(--primary-muted);color:var(--muted)}.secondary.disabled{background:var(--secondary-muted);color:var(--muted)}button:disabled{cursor:default}.statuses{display:flex;flex-wrap:wrap;gap:16px;padding:0 22px 20px;font-size:12px}.theme footer{display:flex;justify-content:space-between;gap:14px;padding:14px 22px;border-top:1px solid var(--border-muted);font-size:10px}.transparent{background:transparent;border:1px dashed var(--border);padding:2px 6px}[hidden]{display:none!important}@media(max-width:700px){.masthead{align-items:start;flex-direction:column}.groups{grid-template-columns:1fr}.theme header{flex-wrap:wrap}}
</style>
<div class="masthead"><div><span class="eyebrow">Ferriswatch / {{palette_count}} palettes / {{family_count}} families</span><h1>A palette, in context.</h1><p>Compare surfaces, filled actions and diagnostic colours. Choose an accent to see its foregrounds change. Every sample uses the library's resolved colours.</p></div><div><label for="search">Find a theme</label><input id="search" type="search" placeholder="Family, variant or ID"><output id="count"></output></div></div>
