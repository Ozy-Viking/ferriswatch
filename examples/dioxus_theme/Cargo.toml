[package]
name = "ferriswatch-dioxus-example"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
ferriswatch = { path = "../..", features = ["dioxus"] }
ferriswatch-componant = { path = "../../ferriswatch-componant" }
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks", "launch", "web", "asset"] }

web-sys = { version = "0.3", features = ["Window", "Navigator", "Clipboard"] }
wasm-bindgen-futures = "0.4"
