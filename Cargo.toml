[workspace]
resolver = "3"
members = ["ferriswatch-componant"]
default-members = ["."]

[workspace.package]
version = "0.3.4"
edition = "2024"
authors = ["Zack Hankin <onedev+rust/ferriswatch@hankin.io>"]
license = "MIT"
description = "Shared themes and colour palettes for consistent styling across applications"
repository = "https://github.com/Ozy-Viking/ferriswatch/"
keywords = ["theme", "palette", "colors", "styling"]
categories = ["gui"]

[workspace.dependencies]
dioxus = { version = "0.7.10", default-features = false, features = [
    "macro",
    "html",
    "signals",
    "hooks",
    "document",
    "asset",
] }
dioxus-primitives = { version = "=0.0.1", registry = "onedev", default-features = false, features = [
    "web",
] }
dioxus-icons = { version = "0.1.0", default-features = false }
web-sys = { version = "0.3", features = ["Location"] }
ferriswatch = { path = ".", version = "0.3.1", registry = "onedev" }
syntect = { version = "5.3", default-features = false }

[package]
name = "ferriswatch"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
readme = "README.md"
repository.workspace = true
publish = ["crates-io", "onedev"]
keywords.workspace = true
categories.workspace = true
include = [
    "build.rs",
    "/LICENSE",
    "/README.md",
    "src/**",
    "docs/Color.md",
    "docs/Css.md",
    "docs/Dioxus.md",
    "docs/Palettes.md",
    "tools/generate_css.rs",
    "!tests/**",
    "!tools/README.md",
]

[dependencies]
miette = { version = "7.6", features = ["fancy", "serde"] }
serde = "1.0"
thiserror = "2.0"
dioxus = { workspace = true, optional = true }
syntect = { workspace = true, optional = true }

[dev-dependencies]
rstest = "0.27.0"

# Dioxus 0.7.10's document integration enables web history without its Location
# binding. Keep this feature-unification fix limited to Dioxus browser builds.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, optional = true }

[features]
dioxus = ["dep:dioxus", "dep:web-sys"]
syntect = ["dep:syntect"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[[bin]]
name = "ferriswatch-generate-css"
path = "tools/generate_css.rs"
