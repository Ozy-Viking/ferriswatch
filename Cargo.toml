[workspace]
resolver = "3"
members = [
    "crates/ferriswatch-components",
    "crates/ferriswatch-core",
    "crates/ferriswatch-macros",
    "crates/vendor/*",
    "examples/dioxus_theme",
]
default-members = ["."]

[workspace.package]
version = "0.4.6"
edition = "2024"
authors = ["Zack Hankin <onedev+rust/ferriswatch@hankin.io>"]
license = "MIT"
publish = ["crates-io", "onedev"]
description = "Shared themes and colour palettes for consistent styling across applications"
repository = "https://github.com/Ozy-Viking/ferriswatch/"
keywords = ["theme", "palette", "colors", "styling"]
categories = ["gui"]

[workspace.dependencies]

ferriswatch = { path = ".", version = "0.4", registry = "onedev" }
ferriswatch-core = { path = "crates/ferriswatch-core", version = "0.4", registry = "onedev" }
ferriswatch-components = { path = "crates/ferriswatch-components", version = "0.4", registry = "onedev" }
ferriswatch-macros = { path = "crates/ferriswatch-macros", version = "0.4", registry = "onedev" }

dioxus-sdk-storage = "0.7.0"
dioxus-attributes = { package = "ferriswatch-vendor-dioxus-attributes", path = "crates/vendor/ferriswatch-vendor-dioxus-attributes", version = "0.4", registry = "onedev" }
dioxus-primitives = { package = "ferriswatch-vendor-dioxus-primitives", path = "crates/vendor/ferriswatch-vendor-dioxus-primitives", version = "0.4", registry = "onedev", default-features = false }
dioxus = { version = "0.7.10", default-features = false, features = [
    "macro",
    "html",
    "signals",
    "hooks",
    "document",
    "asset",
] }
dioxus-icons = { version = "0.1.0", default-features = false }
web-sys = { version = "0.3", features = ["Location"] }
syntect = { version = "5.3", default-features = false }
miette = { version = "7.6", features = ["fancy", "serde"] }
serde = "1.0"
thiserror = "2.0"
rstest = "0.27.0"
wasm-bindgen-futures = "0.4"
dioxus-rsx = "0.7.10"
dioxus-sdk-time = "0.7.0"
dioxus-ssr = "0.7.10"
lazy-js-bundle = "0.7.9"
num-integer = "0.1.46"
palette = "0.7.6"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2", features = ["full", "extra-traits"] }
time = { version = "0.3.44", features = [
    "std",
    "macros",
    "parsing",
    "local-offset",
] }
tracing = { version = "0.1", features = ["std"] }

[package]
name = "ferriswatch"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
publish.workspace = true
keywords.workspace = true
categories.workspace = true
include = [
    "build.rs",
    "/LICENSE",
    "/README.md",
    "src/**",
    "docs/Color.md",
    "docs/Css.md",
    "docs/Dioxus.md",
    "docs/Palettes.md",
    "tools/generate_css.rs",
    "!tests/**",
    "!tools/README.md",
]

[dependencies]
ferriswatch-components = { workspace = true, optional = true }
ferriswatch-core.workspace = true


[dev-dependencies]
dioxus.workspace = true
rstest.workspace = true
syntect.workspace = true

[features]
dioxus = ["ferriswatch-core/dioxus"]
dioxus-components = ["dioxus", "dep:ferriswatch-components"]
syntect = ["ferriswatch-core/syntect"]
parser = ["ferriswatch-core/parser"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[[bin]]
name = "ferriswatch-generate-css"
path = "tools/generate_css.rs"

[profile.dev]
debug = true
strip = "none"
